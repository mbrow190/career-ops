<!--
  certifications.html - ATS section partial for Certifications.

  Field placeholders filled per entry:
    TITLE      - certification name
    ORG_BLOCK  - issuer when present; omitted when absent
    YEAR_BLOCK - year when present; omitted when absent

  Stacked blocks only, so a parser walking the text layer reads
  name, then issuer, then year.
-->
<!--ENTRY-->
<div class="cert-item">
  <span class="cert-title">{{TITLE}}</span>
  {{ORG_BLOCK}}
  {{YEAR_BLOCK}}
</div>
<!--ORG_BLOCK--><span class="cert-org">{{ORG}}</span><!--/ORG_BLOCK-->
<!--ORG_EMPTY--><!--/ORG_EMPTY-->
<!--YEAR_BLOCK--><span class="cert-year">{{YEAR}}</span><!--/YEAR_BLOCK-->
<!--YEAR_EMPTY--><!--/YEAR_EMPTY-->
<!--/ENTRY-->
