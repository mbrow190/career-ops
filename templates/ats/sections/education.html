<!--
  education.html - ATS section partial for Education.

  Field placeholders filled per entry:
    TITLE      - degree / course title
    ORG_BLOCK  - institution when present; omitted otherwise
    YEAR_BLOCK - year when present; omitted when absent
    DESC_BLOCK - description when present; omitted otherwise

  School is a sibling of the degree, not nested inside it.
-->
<!--ENTRY-->
<div class="edu-item">
  <div class="edu-title">{{TITLE}}</div>
  {{ORG_BLOCK}}
  {{YEAR_BLOCK}}
  {{DESC_BLOCK}}
</div>
<!--ORG_BLOCK--><div class="edu-org">{{ORG}}</div><!--/ORG_BLOCK-->
<!--YEAR_BLOCK--><div class="edu-year">{{YEAR}}</div><!--/YEAR_BLOCK-->
<!--DESC_BLOCK--><div class="edu-desc">{{DESC}}</div><!--/DESC_BLOCK-->
<!--/ENTRY-->
