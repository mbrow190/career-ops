<!--
  awards.html - ATS section partial for Awards and Honors.

  Field placeholders filled per entry:
    TITLE      - award name
    ORG_BLOCK  - issuing body when present; omitted when absent
    YEAR_BLOCK - year when present; omitted when absent

  Stacked blocks only, same reading order as certifications.
-->
<!--ENTRY-->
<div class="award-item">
  <span class="award-title">{{TITLE}}</span>
  {{ORG_BLOCK}}
  {{YEAR_BLOCK}}
</div>
<!--ORG_BLOCK--><span class="award-org">{{ORG}}</span><!--/ORG_BLOCK-->
<!--ORG_EMPTY--><!--/ORG_EMPTY-->
<!--YEAR_BLOCK--><span class="award-year">{{YEAR}}</span><!--/YEAR_BLOCK-->
<!--YEAR_EMPTY--><!--/YEAR_EMPTY-->
<!--/ENTRY-->
